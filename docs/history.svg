<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">DentSignal telephony history</title>
<desc id="d">A four-stage historical timeline from an earlier provider implementation through hardening, migration work, and a later architecture era.</desc>
<rect width="1200" height="320" fill="#0b1020"/>
<text x="56" y="52" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="700">Telephony archaeology, without pretending the fossil is still alive.</text>
<path d="M110 170 H1090" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
  <g transform="translate(170)"><circle cy="170" r="30" fill="#ef4444"/><text y="177" fill="#fff" font-size="17" font-weight="700">1</text><text y="220" fill="#fecaca" font-size="16">earlier provider era</text></g>
  <g transform="translate(455)"><circle cy="170" r="30" fill="#f59e0b"/><text y="177" fill="#111827" font-size="17" font-weight="700">2</text><text y="220" fill="#fde68a" font-size="16">hardening</text></g>
  <g transform="translate(740)"><circle cy="170" r="30" fill="#a78bfa"/><text y="177" fill="#111827" font-size="17" font-weight="700">3</text><text y="220" fill="#ede9fe" font-size="16">migration work</text></g>
  <g transform="translate(1025)"><circle cy="170" r="30" fill="#60a5fa"/><text y="177" fill="#111827" font-size="17" font-weight="700">4</text><text y="220" fill="#dbeafe" font-size="16">later architecture</text></g>
</g>
<text x="1140" y="286" fill="#64748b" font-family="Arial,sans-serif" font-size="13" text-anchor="end">Historical evidence ≠ current provider claim.</text>
</svg>