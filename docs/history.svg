<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">DentSignal historical Twilio timeline</title>
  <desc id="desc">A three-stage timeline showing an earlier Twilio implementation, later hardening and migration preparation, and Twilio removal from the active private code and docs.</desc>

  <rect width="1200" height="360" fill="#faf9f6"/>

  <text x="56" y="52" fill="#667085" font-family="Arial, sans-serif" font-size="13" letter-spacing="2.4">DENTSIGNAL / HISTORICAL TELEPHONY EVIDENCE</text>
  <text x="56" y="94" fill="#101828" font-family="Arial, sans-serif" font-size="28" font-weight="700">Earlier implementation → hardening → migration</text>

  <line x1="145" y1="176" x2="1055" y2="176" stroke="#98a2b3" stroke-width="2"/>
  <path d="M1055 176 L1039 168 L1039 184 Z" fill="#98a2b3"/>

  <circle cx="190" cy="176" r="11" fill="#101828"/>
  <circle cx="600" cy="176" r="11" fill="#344054"/>
  <circle cx="1010" cy="176" r="11" fill="#475467"/>

  <text x="190" y="142" text-anchor="middle" fill="#475467" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">09 JAN 2026</text>
  <text x="190" y="219" text-anchor="middle" fill="#101828" font-family="Arial, sans-serif" font-size="18" font-weight="700">Twilio path in private history</text>
  <text x="190" y="247" text-anchor="middle" fill="#667085" font-family="Arial, sans-serif" font-size="14">voice · callbacks · number lifecycle</text>
  <text x="190" y="273" text-anchor="middle" fill="#98a2b3" font-family="Arial, sans-serif" font-size="12">6eb60ec</text>

  <text x="600" y="142" text-anchor="middle" fill="#475467" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">02–09 FEB 2026</text>
  <text x="600" y="219" text-anchor="middle" fill="#101828" font-family="Arial, sans-serif" font-size="18" font-weight="700">Migration prep + hardening</text>
  <text x="600" y="247" text-anchor="middle" fill="#667085" font-family="Arial, sans-serif" font-size="14">masking · logging cleanup · safer errors</text>
  <text x="600" y="273" text-anchor="middle" fill="#98a2b3" font-family="Arial, sans-serif" font-size="12">130de4 · b13ba5 · f311ab · df8804 · 68c253</text>

  <text x="1010" y="142" text-anchor="middle" fill="#475467" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">07 MAR 2026</text>
  <text x="1010" y="219" text-anchor="middle" fill="#101828" font-family="Arial, sans-serif" font-size="18" font-weight="700">Twilio migration / removal</text>
  <text x="1010" y="247" text-anchor="middle" fill="#667085" font-family="Arial, sans-serif" font-size="14">removed from active private code/docs</text>
  <text x="1010" y="273" text-anchor="middle" fill="#98a2b3" font-family="Arial, sans-serif" font-size="12">07506d6</text>

  <line x1="56" y1="315" x2="1144" y2="315" stroke="#eaecf0" stroke-width="1"/>
  <text x="56" y="338" fill="#667085" font-family="Arial, sans-serif" font-size="13">Historical evidence ≠ current provider/runtime. Current architecture needs separate evidence.</text>
</svg>
