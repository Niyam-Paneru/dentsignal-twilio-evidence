<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="t d">
<title id="t">DentSignal telephony history</title><desc id="d">Historical Twilio implementation sits in an earlier layer, followed by hardening and migration work; later architecture is explicitly separate.</desc>
<rect width="1200" height="540" fill="#f5f5f1"/>
<text x="56" y="62" fill="#71716a" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">DENTSIGNAL / TELEPHONY HISTORY</text>
<text x="56" y="105" fill="#171714" font-family="Georgia,serif" font-size="34">Read this repo as evidence history, not a live topology map.</text>

<rect x="82" y="165" width="700" height="84" rx="14" fill="#dce9de" stroke="#4f7555" stroke-width="2"/>
<text x="108" y="196" fill="#4f7555" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">EARLIER IMPLEMENTATION</text>
<text x="108" y="226" fill="#171714" font-family="Georgia,serif" font-size="23">voice flow · callbacks · number management</text>

<rect x="82" y="267" width="700" height="84" rx="14" fill="#e4edb0" stroke="#596e35" stroke-width="2"/>
<text x="108" y="298" fill="#596e35" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">HARDENING</text>
<text x="108" y="328" fill="#171714" font-family="Georgia,serif" font-size="23">repair · masking · migration preparation</text>

<rect x="82" y="369" width="700" height="84" rx="14" fill="#f1d9dc" stroke="#a4243b" stroke-width="2"/>
<text x="108" y="400" fill="#a4243b" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">LATER WORK</text>
<text x="108" y="430" fill="#171714" font-family="Georgia,serif" font-size="23">provider changes / later architecture lives elsewhere</text>

<line x1="860" y1="165" x2="860" y2="453" stroke="#171714" stroke-width="2"/>
<text x="900" y="198" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">EVIDENCE RULE</text>
<text x="900" y="236" fill="#171714" font-family="Georgia,serif" font-size="24">Old code proves old work.</text>
<text x="900" y="274" fill="#71716a" font-family="Arial,sans-serif" font-size="14">It does not prove today's runtime.</text>
<text x="900" y="303" fill="#71716a" font-family="Arial,sans-serif" font-size="14">That claim needs separate evidence.</text>
</svg>